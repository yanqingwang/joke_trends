name: weekly report

on:
  schedule:
    # 每周一 03:02 UTC（北京时间周一 11:02）
    - cron: "2 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate weekly report
        env:
          PROFILE: joke
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.main --profile "$PROFILE"

      - name: Commit new report
        run: |
          git config user.name "joke-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "weekly report $(date -u +%Y-%m-%d)"
            git push
          fi
